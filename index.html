<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peech Clone - Scan & Listen</title>
    <!-- IA OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

        :root {
            --bg-color: #0f0f13;
            --primary: #8a2be2;
            --secondary: #00e5ff;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { background-color: var(--bg-color); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .app-container {
            width: 100%; max-width: 400px; height: 100vh; max-height: 850px;
            background: linear-gradient(180deg, #1a1a24 0%, #0f0f13 100%);
            position: relative; display: flex; flex-direction: column; padding: 20px; box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 800; background: linear-gradient(45deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .cover-section {
            position: relative; width: 220px; height: 300px; margin: 0 auto 20px;
            border-radius: 20px; display: flex; justify-content: center; align-items: center; perspective: 1000px;
        }

        .book-cover { width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1544947950-fa07a98d237f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); z-index: 2; transition: transform 0.3s ease; }
        .glow { position: absolute; width: 100%; height: 100%; background: linear-gradient(45deg, var(--primary), var(--secondary)); border-radius: 20px; filter: blur(30px); opacity: 0; transition: opacity 0.5s ease; z-index: 1; }

        .visualizer { position: absolute; bottom: -20px; display: flex; gap: 5px; opacity: 0; transition: opacity 0.5s ease; z-index: 3; }
        .bar { width: 6px; height: 10px; background: var(--secondary); border-radius: 10px; }

        .playing .glow { opacity: 0.8; animation: pulseGlow 2s infinite alternate; }
        .playing .book-cover { transform: scale(1.05) rotateY(10deg); }
        .playing .visualizer { opacity: 1; }
        .playing .bar { animation: equalize 1s infinite alternate; }
        .playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .bar:nth-child(2) { animation-delay: 0.3s; }
        .playing .bar:nth-child(3) { animation-delay: 0.5s; }
        .playing .bar:nth-child(4) { animation-delay: 0.2s; }
        .playing .bar:nth-child(5) { animation-delay: 0.4s; }

        .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        .scan-btn {
            background: linear-gradient(45deg, #ff007f, #7928ca); border: none; color: white; padding: 10px 15px; border-radius: 12px;
            font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4); transition: transform 0.2s;
        }
        .scan-btn:active { transform: scale(0.95); }

        .text-container { flex-grow: 1; background: var(--glass); backdrop-filter: blur(10px); border-radius: 15px; padding: 15px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        textarea { width: 100%; height: 100%; background: transparent; border: none; color: #ddd; font-size: 15px; line-height: 1.5; resize: none; outline: none; }

        .controls { display: flex; justify-content: center; align-items: center; gap: 20px; padding-bottom: 10px; }
        .btn { background: var(--glass); border: none; color: white; font-size: 24px; width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(10px); transition: transform 0.2s; }
        .btn:active { transform: scale(0.9); }
        .play-btn { width: 70px; height: 70px; font-size: 30px; background: linear-gradient(45deg, var(--primary), var(--secondary)); box-shadow: 0 10px 20px rgba(138, 43, 226, 0.4); }

        .scan-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 19, 0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(15px); opacity: 1; transition: opacity 0.3s;
        }
        .scan-overlay.hidden { opacity: 0; pointer-events: none; }
        
        .scanner-box { width: 250px; height: 350px; border: 3px solid var(--secondary); border-radius: 15px; position: relative; overflow: hidden; box-shadow: 0 0 30px rgba(0, 229, 255, 0.5); margin-bottom: 20px; }
        .scanner-laser { width: 100%; height: 3px; background: #ff007f; box-shadow: 0 0 15px #ff007f, 0 0 30px #ff007f; position: absolute; top: 0; animation: scanAnim 2s infinite alternate ease-in-out; }
        .scan-text { color: var(--secondary); font-size: 18px; font-weight: 600; text-align: center; text-shadow: 0 0 10px var(--secondary); margin-bottom: 10px;}
        .scan-subtext { color: #888; font-size: 12px; text-align: center; }

        @keyframes pulseGlow { 0% { filter: blur(30px); transform: scale(1); } 100% { filter: blur(50px); transform: scale(1.1); } }
        @keyframes equalize { 0% { height: 10px; } 50% { height: 40px; background: var(--primary); } 100% { height: 15px; } }
        @keyframes scanAnim { 0% { top: 0; } 100% { top: 100%; } }
    </style>
</head>
<body>

    <div class="app-container" id="app">
        <div class="scan-overlay hidden" id="scanOverlay">
            <div class="scanner-box"><div class="scanner-laser"></div></div>
            <p class="scan-text" id="scanProgress">Préparation de l'image...</p>
            <p class="scan-subtext">Veuillez patienter, l'IA lit le texte.</p>
        </div>

        <div class="header">
            <h1>EchoBook AI</h1>
            <div style="font-size: 24px;">⚙️</div>
        </div>

        <div class="cover-section" id="cover">
            <div class="glow"></div><div class="book-cover"></div>
            <div class="visualizer"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
        </div>

        <div class="actions-bar">
            <!-- J'ai retiré capture="environment" pour éviter les crashs -->
            <input type="file" id="cameraInput" accept="image/*" style="display: none;">
            <button class="scan-btn" id="scanBtn">📷 Scanner une page</button>
            <select id="voices" style="background: var(--glass); color: white; border: none; padding: 10px; border-radius: 10px;"></select>
        </div>

        <div class="text-container">
            <textarea id="text-input" placeholder="Écris, colle ou scanne un livre..."></textarea>
        </div>

        <div class="controls">
            <button class="btn" onclick="stopAudio()">⏹️</button>
            <button class="btn play-btn" id="playBtn" onclick="togglePlay()">▶️</button>
            <button class="btn" onclick="restartAudio()">🔄</button>
        </div>
    </div>

    <script>
        // --- AUDIO ---
        const synth = window.speechSynthesis;
        let isPlaying = false;
        const app = document.getElementById('app');
        const playBtn = document.getElementById('playBtn');
        const textInput = document.getElementById('text-input');
        const voiceSelect = document.getElementById('voices');

        let voices = [];
        function populateVoiceList() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = '';
            voices.forEach((v, i) => {
                if(v.lang.includes('fr')) {
                    let opt = document.createElement('option');
                    opt.textContent = v.name.substring(0, 15) + "...";
                    opt.value = i;
                    voiceSelect.appendChild(opt);
                }
            });
        }
        populateVoiceList();
        if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoiceList;

        function togglePlay() {
            if (synth.speaking && !synth.paused && isPlaying) { synth.pause(); isPlaying = false; updateUI(); } 
            else if (synth.paused && !isPlaying) { synth.resume(); isPlaying = true; updateUI(); } 
            else { startReading(); }
        }

        function startReading() {
            if (textInput.value.trim() !== '') {
                const utterance = new SpeechSynthesisUtterance(textInput.value);
                if (voices.length > 0) utterance.voice = voices[voiceSelect.value];
                utterance.onend = () => { isPlaying = false; updateUI(); };
                synth.speak(utterance); isPlaying = true; updateUI();
            }
        }
        function stopAudio() { synth.cancel(); isPlaying = false; updateUI(); }
        function restartAudio() { stopAudio(); setTimeout(startReading, 200); }
        function updateUI() { if (isPlaying) { app.classList.add('playing'); playBtn.innerHTML = '⏸️'; } else { app.classList.remove('playing'); playBtn.innerHTML = '▶️'; } }

        // --- SCAN OCR (Anti-Crash) ---
        const cameraInput = document.getElementById('cameraInput');
        const scanBtn = document.getElementById('scanBtn');
        const scanOverlay = document.getElementById('scanOverlay');
        const scanProgress = document.getElementById('scanProgress');

        scanBtn.addEventListener('click', () => cameraInput.click());

        // Fonction pour réduire la taille de l'image avant l'IA
        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 1000; // Largeur max pour éviter le crash
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    // Retourne l'image compressée (qualité 80%)
                    callback(canvas.toDataURL('image/jpeg', 0.8));
                }
            }
        }

        cameraInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            stopAudio();
            scanOverlay.classList.remove('hidden');
            scanProgress.innerText = "Compression de l'image...";

            // 1. On compresse l'image d'abord
            compressImage(file, async (compressedImageData) => {
                scanProgress.innerText = "Démarrage de l'IA...";

                try {
                    // 2. On envoie l'image compressée à l'IA
                    const result = await Tesseract.recognize(
                        compressedImageData,
                        'fra',
                        {
                            logger: m => {
                                if (m.status === 'recognizing text') {
                                    const pct = Math.round(m.progress * 100);
                                    scanProgress.innerText = `Analyse en cours... ${pct}%`;
                                }
                            }
                        }
                    );
                    textInput.value = result.data.text;
                } catch (err) {
                    alert("Erreur de scan. Essayez avec une photo plus nette.");
                    console.error(err);
                } finally {
                    scanOverlay.classList.add('hidden');
                    cameraInput.value = ""; 
                }
            });
        });
    </script>
</body>
</html>
